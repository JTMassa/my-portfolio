name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

     
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

     
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

     
      - name: Build Docker images
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.run_number }} .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry  }}
          ECR_REPOSITORY: jull_docker_image

     
      - name: Push Docker images
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.run_number }} 
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest 
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry  }}
          ECR_REPOSITORY: jull_docker_image

  Deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: SSH to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          #port: ${{ secrets.PORT }}
          script: |
            docker run -d $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.run_number }}  
            docker run -d $ECR_REGISTRY/$ECR_REPOSITORY:latest 
              
