name: Utc app CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  id-token: write
env:
    python-version: 3.11
    IMAGE_NAME: portfolio
    AWS_REGION: us-east-1
    ACCOUNT_ID: ${{secrets.AWS_ACCOUNT_ID}}
    ECR_REPO: ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/utc_app/portfolio
jobs:
    build: 
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v4
              with:
                  python-version: ${{ env.python-version }} # or $python-version
            - name: install pytest
              run: pip install -r requirements.txt

            - name: unit test
              run: pytest test.py
            - name: Configure AWS credentials using OIDC
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  role-to-assume: ${{secrets.AWS_ROLE_ARN}}
                  aws-region: ${{ env.AWS_REGION }}
            
            - name: Login to Amazon ECR
              id: login-ecr 
              uses: aws-actions/amazon-ecr-login@v1

            - name: Build Docker image
              run: |
               docker build -t ${{env.IMAGE_NAME}} .
              
            - name: Tag image for ECR
              run: |
               docker tag portfolio:latest \
               ${{ steps.login-ecr.outputs.registry }}/utc_app/portfolio:latest

            
            - name: Trivy scan
              uses: aquasecurity/trivy-action@0.20.0
              with:
               image-ref: ${{ steps.login-ecr.outputs.registry }}/utc_app/portfolio:latest
               format: table
               exit-code: 1
               severity: HIGH,CRITICAL
                
            - name: Push image
              run: |
               docker push \
               ${{ steps.login-ecr.outputs.registry }}/utc_app/portfolio:latest

           
                