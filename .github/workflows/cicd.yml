name: Utc app CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
    python-version: 3.11
jobs:
    build: 
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v4
              with:
                  python-version: ${{ env.python-version }} # or $python-version
            - name: Install dependencies
              run: pip install pytest

            - name: Run tests
              run: pytest

            - name: build image
              run: docker build -t JTMassa/portcicd .
                